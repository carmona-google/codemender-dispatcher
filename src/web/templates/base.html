<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CodeMender Security Console{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Diff2HTML CSS/JS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css">
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
    <style>
        .gradient-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- Navbar -->
    <header class="gradient-header border-b border-slate-800 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
                    CM
                </div>
                <div>
                    <a href="/" class="text-xl font-bold text-white hover:text-indigo-400 transition">CodeMender</a>
                    <span class="text-xs bg-indigo-900/60 text-indigo-300 px-2 py-0.5 rounded ml-2 border border-indigo-700">Remote Dispatcher</span>
                </div>
            </div>
            <div class="flex items-center space-x-4 text-sm text-slate-400">
                <span class="inline-flex items-center">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                    Split Execution Model: Active
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        CodeMender Remote Dispatcher & Execution Sandbox &bull; Confined Blast Radius &bull; Zero Source Code Exfiltration
    </footer>
</body>
</html>
